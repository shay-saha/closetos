spring:
  application:
    name: closetos-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/closetos}
    username: ${DATABASE_USERNAME:closetos}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: closetos-api
logging:
  structured:
    format:
      console: ecs
closetos:
  media:
    cloudfront-domain: ${CLOUDFRONT_DOMAIN:}
    cloudfront-key-id: ${CLOUDFRONT_KEY_ID:}
    cloudfront-private-key: ${CLOUDFRONT_PRIVATE_KEY:}
  auth:
    client-id: ${COGNITO_CLIENT_ID}
