name: Security gates

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      release_environment:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_environment || 'standalone' }}
  cancel-in-progress: true

jobs:
  report-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: make test-security-gates

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Resolve Maven dependencies into the scanner's local cache
        working-directory: apps/api
        run: ./mvnw -B -ntp dependency:go-offline
      - name: Install the checksum-verified vulnerability scanner
        run: ./scripts/install-trivy.sh .security/bin
      - name: Reject critical dependency vulnerabilities, including development dependencies
        run: make scan-dependencies
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-security-results
          path: .security/reports/dependencies.json
          retention-days: 14

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
          - service: web
            context: .
            dockerfile: apps/web/Dockerfile
          - service: media-worker
            context: .
            dockerfile: workers/media-processor/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the checksum-verified vulnerability scanner
        run: ./scripts/install-trivy.sh .security/bin
      - name: Build the deployable image from current base images
        env:
          SERVICE: ${{ matrix.service }}
          BUILD_CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build --pull --iidfile "$RUNNER_TEMP/image-id" --file "$DOCKERFILE" --tag "closetos-$SERVICE:security" "$BUILD_CONTEXT"
      - name: Reject critical vulnerabilities in the exact built image
        env:
          SERVICE: ${{ matrix.service }}
        run: ./scripts/scan-container.sh "$SERVICE" "$(cat "$RUNNER_TEMP/image-id")"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: container-security-${{ matrix.service }}
          path: .security/reports/${{ matrix.service }}.json
          retention-days: 14

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: inputs.release_environment != '' || !github.event.repository.private || vars.CODEQL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Download the checksum-verified CodeQL bundle
        run: ./scripts/download-codeql.sh "$RUNNER_TEMP/codeql-bundle-linux64.tar.gz"
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          tools: ${{ runner.temp }}/codeql-bundle-linux64.tar.gz
          queries: security-extended
      - name: Extract Java from a clean compilation
        if: matrix.language == 'java-kotlin'
        working-directory: apps/api
        run: ./mvnw -B -ntp clean package -DskipTests -Dspotless.skip=true
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        id: analyze
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          upload: never
          upload-database: false
      - name: Reject critical source findings and incomplete analysis
        env:
          SARIF_DIRECTORY: ${{ steps.analyze.outputs.sarif-output }}
        run: node scripts/check-codeql-results.mjs "$SARIF_DIRECTORY"
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always() && steps.analyze.outcome == 'success' && (!github.event.repository.private || vars.CODEQL_UPLOAD_ENABLED == 'true')
        with:
          sarif_file: ${{ runner.temp }}/codeql-results
          category: /language:${{ matrix.language }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: codeql-security-${{ matrix.language }}
          path: ${{ runner.temp }}/codeql-results
          retention-days: 14
