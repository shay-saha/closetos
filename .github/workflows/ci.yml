name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
      - name: Verify infrastructure formatting, schema, and mocked AWS contracts
        run: make test-infra

  media-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: workers/media-processor/uv.lock
      - run: uv sync --project workers/media-processor --locked
      - run: make test-worker

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Verify formatting, module boundaries, and PostgreSQL integration
        working-directory: apps/api
        run: ./mvnw -B -ntp verify
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: apps/api/target/surefire-reports

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: workers/media-processor/uv.lock
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/prepare-local-env.py
      - run: uv sync --project workers/media-processor --locked
      - run: docker compose up -d --wait
      - run: uv run --project workers/media-processor python scripts/prepare-local-storage.py
      - name: Start local media worker
        run: |
          ./scripts/prepare-local-models.sh
          ./scripts/run-media-worker.sh > /tmp/closetos-worker.log 2>&1 &
          python3 scripts/wait-for-http.py http://localhost:8800/health
      - run: python3 scripts/wait-for-http.py http://localhost:8081/realms/closetos/.well-known/openid-configuration
      - name: Start local API
        run: |
          ./scripts/run-api.sh > /tmp/closetos-api.log 2>&1 &
          python3 scripts/wait-for-http.py http://localhost:8080/actuator/health
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report
            test-results
