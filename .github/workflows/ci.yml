name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_environment:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_environment || 'standalone' }}
  cancel-in-progress: true

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter closetos
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.4"
      - name: Verify infrastructure formatting, schema, and mocked AWS contracts
        run: make test-infra
      - name: Verify offline release publication and digest checks
        run: make test-release

  media-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: workers/media-processor/uv.lock
      - run: uv sync --project workers/media-processor --locked
      - name: Check release tool formatting and lint
        run: |
          uv run --project workers/media-processor ruff check scripts/release_*.py scripts/test_release_*.py
          uv run --project workers/media-processor ruff format --check scripts/release_*.py scripts/test_release_*.py
      - run: make test-worker

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Verify formatting, module boundaries, and PostgreSQL integration
        working-directory: apps/api
        run: ./mvnw -B -ntp verify
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-test-results
          path: apps/api/target/surefire-reports

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: critical

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  browser:
    name: Native browser verification (12 GiB runner)
    if: inputs.release_environment != '' || !github.event.repository.private || vars.MEDIA_NATIVE_RUNNER != ''
    runs-on: ${{ vars.MEDIA_NATIVE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check memory for native processing and local services
        shell: bash
        run: |
          memory_bytes="$(docker info --format '{{.MemTotal}}')"
          if [[ ! "$memory_bytes" =~ ^[0-9]+$ ]] || (( memory_bytes < 12 * 1024 * 1024 * 1024 )); then
            echo '::error::Native media checks need at least 12 GiB of Docker host memory. Set MEDIA_NATIVE_RUNNER to a runner label with sufficient memory.'
            exit 1
          fi
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: workers/media-processor/uv.lock
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/prepare-local-env.py
      - run: uv sync --project workers/media-processor --locked
      - run: docker compose up -d --wait
      - run: uv run --project workers/media-processor python scripts/prepare-local-storage.py
      - name: Verify native media processing in the read-only worker container
        run: make test-worker-container
      - name: Verify standalone migrations from the packaged API image
        run: make test-migration-container
      - name: Start local media worker
        run: |
          ./scripts/prepare-local-models.sh
          ./scripts/run-media-worker.sh > /tmp/closetos-worker.log 2>&1 &
          python3 scripts/wait-for-http.py http://localhost:8800/health
      - run: python3 scripts/wait-for-http.py http://localhost:8081/realms/closetos/.well-known/openid-configuration
      - name: Start local API
        run: |
          ./scripts/run-api.sh > /tmp/closetos-api.log 2>&1 &
          python3 scripts/wait-for-http.py http://localhost:8080/actuator/health
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report
            test-results
