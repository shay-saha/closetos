version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/aws
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/bootstrap
    schedule:
      interval: weekly
