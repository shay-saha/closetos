[project]
name = "closetos-media"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "pillow>=12,<14",
  "pillow-heif>=1,<2",
  "pydantic>=2.12,<3",
  "rembg[cpu]>=2.0.67,<3",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/closetos_media"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
