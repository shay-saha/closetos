services:
  identity:
    image: quay.io/keycloak/keycloak:26.7.3
    command: [start-dev, --import-realm]
    environment:
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./infra/local/realm.json:/opt/keycloak/data/import/realm.json:ro
      - identity-data:/opt/keycloak/data
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: closetos
      POSTGRES_USER: closetos
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closetos -d closetos"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  identity-data:
  postgres-data:
