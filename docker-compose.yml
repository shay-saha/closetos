services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: closetos
      POSTGRES_USER: closetos
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closetos -d closetos"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
