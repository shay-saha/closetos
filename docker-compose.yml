services:
  storage:
    build:
      context: .
      dockerfile: infra/local/Minio.Dockerfile
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - media-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
  identity:
    image: quay.io/keycloak/keycloak:26.7.3
    command: [start-dev, --import-realm]
    environment:
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: closetos-local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set KC_BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./infra/local/realm.json:/opt/keycloak/data/import/realm.json:ro
      - identity-data:/opt/keycloak/data
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: closetos
      POSTGRES_USER: closetos
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closetos -d closetos"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  media-data:
  identity-data:
  postgres-data:
